name: plugin-compat-issue

# Receives compatibility failures reported by dsh-docker and files them here.
#
# Why this repository: the plugin is the thing under test, so the issue belongs
# where the fix lands. dsh-docker cannot open it directly — a workflow's own
# GITHUB_TOKEN is scoped to its own repository — so it sends a
# `repository_dispatch` event instead, and this workflow opens the issue with
# *this* repository's token. That keeps the cross-repository credential on the
# sending side limited to "may dispatch events here" rather than "may write
# issues everywhere".
#
# Payload (all optional except plugin_version):
#   plugin_version  dsh-context-editor version that failed
#   dsh_version     DSH version it was tested against
#   image           image reference, when the test ran inside one
#   run_url         link to the failing workflow run
#   detail          free-form extra context (log tail, failing assertion)

on:
  repository_dispatch:
    types: [plugin-compat-failed]

permissions:
  contents: read
  issues: write

jobs:
  file:
    name: file or update the failure issue
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_VERSION: ${{ github.event.client_payload.plugin_version }}
          DSH_VERSION: ${{ github.event.client_payload.dsh_version }}
          IMAGE: ${{ github.event.client_payload.image }}
          RUN_URL: ${{ github.event.client_payload.run_url }}
          DETAIL: ${{ github.event.client_payload.detail }}
        run: |
          set -euo pipefail
          plugin_version="${PLUGIN_VERSION:-unknown}"
          title="[plugin-compat] dsh-context-editor@${plugin_version} failed against ${DSH_VERSION:-DSH}"

          body="$(mktemp)"
          {
            echo "The cross-repository compatibility test failed."
            echo
            echo "- plugin: \`dsh-context-editor@${plugin_version}\`"
            echo "- DSH: \`${DSH_VERSION:-unknown}\`"
            [[ -n "${IMAGE}" ]] && echo "- image: \`${IMAGE}\`"
            [[ -n "${RUN_URL}" ]] && echo "- failing run: ${RUN_URL}"
            echo
            if [[ -n "${DETAIL}" ]]; then
              echo '### Detail'
              echo
              echo '```'
              printf '%s\n' "${DETAIL}"
              echo '```'
              echo
            fi
            echo 'Reproduce locally:'
            echo
            echo '```bash'
            echo '# dsh-docker checkout'
            echo "bash scripts/plugin-compat-image.sh \"${IMAGE:-ghcr.io/2220545672/dsh:latest}\" \"${plugin_version}\""
            echo '```'
          } > "${body}"

          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "plugin-compat in:title" --json number,title \
            | jq -r --arg title "${title}" '.[] | select(.title == $title) | .number' | head -n1)"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
            echo "::notice::commented on existing issue #${existing}"
          else
            url="$(gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body}")"
            echo "::notice::opened ${url}"
          fi
